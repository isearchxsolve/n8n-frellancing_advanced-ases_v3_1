version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # n8n Orchestrator
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: ases-n8n
    restart: unless-stopped
    command: "n8n start"
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${DOMAIN}/
      - GENERIC_TIMEZONE=UTC
      # ASES Integration
      - AGENT_SERVICE_URL=http://agent:8000
      - UPWORK_RSS_URL=${UPWORK_RSS_URL}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TENANT_ID=${TENANT_ID}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_orchestrator.json:/backup/workflow.json:ro
      - ./auto-import.sh:/backup/auto-import.sh:ro
    networks:
      - ases-network
    depends_on:
      - postgres
      - redis

  # ---------------------------------------------------------------------------
  # Agent Service (FastAPI)
  # ---------------------------------------------------------------------------
  agent:
    build:
      context: ./agent_service
      dockerfile: Dockerfile
    container_name: ases-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - VERCEL_TOKEN=${VERCEL_TOKEN}
      - SANDBOX_BASE_DIR=/tmp/ases-sandboxes
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required for sandbox creation
      - agent_sandboxes:/tmp/ases-sandboxes
    networks:
      - ases-network
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ---------------------------------------------------------------------------
  # PostgreSQL (Primary Data Store)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ases-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/migrations:/migrations:ro
    ports:
      - "5432:5432"
    networks:
      - ases-network
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all

  # ---------------------------------------------------------------------------
  # Redis (Cache + Rate Limiting)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ases-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ases-network

  # ---------------------------------------------------------------------------
  # Nginx (Reverse Proxy + SSL)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ases-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_data:/etc/letsencrypt
    networks:
      - ases-network
    depends_on:
      - n8n
      - agent

  # ---------------------------------------------------------------------------
  # Certbot (SSL - Optional)
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: ases-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
    networks:
      - ases-network

volumes:
  n8n_data:
  postgres_data:
  redis_data:
  agent_sandboxes:
  certbot_data:

networks:
  ases-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
